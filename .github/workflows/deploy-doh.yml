name: Update FCM DoH

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare (disable to validate only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fcm-doh-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate hosts parser
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Fetch and validate upstream hosts
        run: python scripts/update_fcm.py

      - name: Check whether data changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- worker/src/fcm-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Validate DoH behavior and Worker build
        working-directory: worker
        run: |
          npm test
          npm run build

      - name: Check Cloudflare credentials
        if: (github.event_name != 'workflow_dispatch' || inputs.deploy) && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."
            exit 1
          fi

      - name: Deploy Worker
        if: (github.event_name != 'workflow_dispatch' || inputs.deploy) && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        working-directory: worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit deployed DNS data
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/fcm-data.js
          git commit -m "chore: Update FCM DNS data [skip ci]"
          git push
